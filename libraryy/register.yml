info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}api/auth/register"
  body:
    type: json
    data: |-
      {
        "username": "newuser",
        "email": "newuser@gmail.com",
        "password": "password123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
